name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.10
    env:
      # golang container: git status is untrusted (safe.directory), so
      # -buildvcs=auto fails. wrk/doctest avoid this by running on the VM.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global --add safe.directory '*'
      - name: Go test go-pkgs/cloudflare/tests
        run: go -C go-pkgs/cloudflare/tests test -v ./...
      - name: Go test go-pkgs/cmd
        run: go -C go-pkgs/cmd test -v ./...
      - name: Go test go-pkgs
        run: go -C go-pkgs test -v ./...

      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest
        run: doctest test -v --label-all ./...
